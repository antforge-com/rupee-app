name: finadvise
description: Meet The Masters - Financial Advisory Platform
 
publish_to: 'none'
 
version: 1.0.0+1
 
environment:
  sdk: '>=3.0.0 <4.0.0'
 
dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.4.0

  # URL Launcher
  url_launcher: ^6.2.0

  # Shared Preferences
  shared_preferences: ^2.2.2

  # HTTP (for export/download flows)
  http: ^1.2.0

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # UI & Fonts
  google_fonts: ^6.1.0

  # Charts
  fl_chart: ^0.67.0

  # State Management
  provider: ^6.1.1

  # Utils
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  file_picker: ^8.0.0+1
  open_filex: ^4.3.4
  path_provider: ^2.1.5
  image_picker: ^1.2.1
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
